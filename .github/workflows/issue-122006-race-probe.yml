name: issue-122006 race probe
on:
  push:
    branches:
      - validation/122006-race-probe
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.12.13"
      - run: uv python install 3.14
      - run: uv sync --locked --python 3.14 --group dev --group test
      - name: Prove pre-transaction classification loses a late user file
        run: |
          cat >> tests/hermes_cli/test_plugins_cmd_catalog.py <<'PY'

          def test_late_user_file_created_during_catalog_preview_survives(world, monkeypatch):
              entry = pc_cat.get_live_catalog_entry("cat-plugin")
              target = cat.install_catalog_entry(entry, force=False)[0]
              world["state"]["pin"] = world["sha2"]

              real_clone = pc._clone_plugin_repo
              calls = {"n": 0}

              def injecting_clone(*args, **kwargs):
                  result = real_clone(*args, **kwargs)
                  calls["n"] += 1
                  if calls["n"] == 1:
                      (target / "late-user.db").write_text("created during preview")
                  return result

              monkeypatch.setattr(pc, "_clone_plugin_repo", injecting_clone)
              result = pc.dashboard_update_user_plugin("cat-plugin")
              assert result["ok"] is True
              assert calls["n"] >= 2
              assert (target / "late-user.db").read_text() == "created during preview"
          PY
          set +e
          .venv/bin/python -m pytest -q tests/hermes_cli/test_plugins_cmd_catalog.py::test_late_user_file_created_during_catalog_preview_survives
          code=$?
          set -e
          echo "expected current-head RED exit=$code"
          test "$code" -ne 0
